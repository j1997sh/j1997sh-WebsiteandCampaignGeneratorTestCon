        <div style="display:flex;align-items:center;gap:10px">
          <div class="global-search-wrap">
            <input class="global-search-input" id="globalSearchInput" placeholder="Search people or websites">
            <span class="global-search-kbd">⌘K</span>
            <div class="search-popover" id="globalSearchPopover"></div>

          <a class="btn secondary small" href="websites.html">Back to websites</a>
        </div></header><div class="app-content">
<div class="page-intro"><div><h2>Create a website</h2><p>Create another campaign site under the same account.</p></div></div>
<div class="account-card" style="max-width:760px">
<form id="createSiteForm"><div class="editor-fields two">
<label class="field"><span>Template</span><select id="newTemplate"><option value="councillor-lite">Campaign website</option></select></label>
<label class="field"><span>Status</span><select><option>Start as draft</option></select></label>
<label class="field"><span>Candidate name</span><input id="newCandidateName" required></label>
<label class="field"><span>Ward / area</span><input id="newCandidateArea" required></label>
<label class="field full"><span>Site address</span><input id="newSiteSlug" placeholder="candidate-name"></label>
</div><div class="button-row" style="margin-top:18px"><a class="btn secondary" href="websites.html">Cancel</a><button class="btn" type="submit">Create draft website</button></div></form>
</div><script>
document.getElementById('createSiteForm').addEventListener('submit',e=>{
 e.preventDefault();const n=document.getElementById('newCandidateName').value.trim(),a=document.getElementById('newCandidateArea').value.trim(),slug=(document.getElementById('newSiteSlug').value.trim()||n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const sites=JSON.parse(localStorage.getItem('cpSites')||'{}');const base={brandNavy:'#08254a',brandBlue:'#1476d4',priorities:[{title:'Fixing roads and pavements',copy:'Push for proper repairs.'},{title:'Cleaner, safer streets',copy:'Back practical action locally.'},{title:'Protecting local services',copy:'Stand up for local services.'}],surveyIntro:'Tell us what matters locally.',surveyQuestion:'What would you change?',votingIntentEnabled:false,campaignTitle:'A local campaign',campaignCopy:'Campaigning on an important local issue.',volunteerHeadline:'Help locally',volunteer1:'Deliver leaflets',volunteer2:'Display a poster',volunteer3:'Join the doorstep team',volunteer4:'Help online',sections:[{id:'about',visible:true},{id:'priorities',visible:true},{id:'survey',visible:true},{id:'campaign',visible:true},{id:'volunteer',visible:true}],images:{}};sites[slug]={name:n,area:a,status:'draft',config:{...base,candidateName:n,candidateInitials:n.split(/\s+/).map(x=>x[0]).join('').slice(0,3).toUpperCase(),candidateArea:a,candidateTitle:'Candidate for '+a,heroHeadline:'A stronger voice for '+a+'.',heroCopy:n+' is standing to be your local councillor.',heroCta:'Tell '+(n.split(/\s+/)[0]||'me')+' what matters',aboutLead:a+' deserves visible, practical local representation.',footerDescription:'A local campaign website for '+n+' in '+a+'.'}};localStorage.setItem('cpSites',JSON.stringify(sites));location.href='editor.html?site='+encodeURIComponent(slug)
})
</script>
</div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js?v=20260826-centered-auth"></script><script src="assets/js/app.js?v=20260826-website-switcher-creative-image"></script><script src="assets/js/supabase-backend.js?v=20260826-centered-auth"></script></body></html>
