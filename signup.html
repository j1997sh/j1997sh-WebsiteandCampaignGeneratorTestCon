<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account | Campaign Platform</title>
<link rel="stylesheet" href="assets/css/style.css?v=20260826-centered-auth">
</head>
<body class="auth-page">
<main class="auth-shell">
  <section class="auth-card">
    <div class="auth-brand">
      <span class="brand-mark">CP</span>
      <div>
        <strong>Campaign Platform</strong>
      </div>
    </div>

    <div class="auth-heading">
      <h1>Create account</h1>
      <p>Set up your campaign workspace.</p>
    </div>

    <form id="stage2SignupForm" class="auth-form">
      <div class="signup-name-grid">
        <label class="field">
          <span>First name</span>
          <input id="signupFirstName" name="first_name" autocomplete="given-name" required>
        </label>
        <label class="field">
          <span>Last name</span>
          <input id="signupLastName" name="last_name" autocomplete="family-name" required>
        </label>
      </div>
      <label class="field">
        <span>Email address</span>
        <input id="signupEmail" name="email" type="email" autocomplete="email" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <button class="btn auth-submit" type="submit" id="signupSubmit">Create account</button>
    </form>

    <div id="signupMessage"></div>

    <div class="auth-links">
      <span>Already have an account? <a href="login.html">Log in</a></span>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js?v=20260826-centered-auth"></script>
<script src="assets/js/signup-stage2.js?v=20260826-centered-auth"></script>
</body>
</html>
