<title>Domains | Campaign Platform</title><link rel="stylesheet" href="assets/css/style.css?v=20260826-org-admin"></head>
<body class="app-body"><div class="app-shell">
<aside class="app-sidebar">
  <div class="brand"><span class="brand-mark">CP</span><span><strong>Campaign Platform</strong><small>Workspace</small></span></div>
  <nav class="side-nav"><a href="dashboard.html">Dashboard</a><a href="websites.html">Websites</a><a href="campaigns.html">Campaigns</a><a href="creative.html">Creative</a><a href="people.html">People</a><a href="surveys.html">Surveys</a><a class="active" href="domains.html">Domains</a><a href="integrations.html">Integrations</a><a href="settings.html">Settings</a></nav>
  <div class="side-bottom"><div class="user-chip"><span class="avatar" id="domainAccountInitials">—</span><span><strong id="domainAccountName">Signed in</strong><small>Signed in</small></span></div><a class="logout-link" id="domainLogout" href="login.html">Log out</a></div>
</aside>
<main class="app-main"><header class="app-topbar"><h1>Domains</h1><button class="btn small" id="addDomainButton">Connect domain</button></header>
<div class="app-content">
  <div class="page-intro"><div><h2>Domains</h2><p>Connect a custom domain to a Website or standalone Campaign microsite.</p></div></div>
  <div id="domainMessage"></div>
  <div class="domain-stage3-grid" id="domainGrid"></div>
</div></main></div>
<div class="cp-dialog-backdrop" id="domainDialog" hidden>
  <div class="cp-dialog domain-dialog">
    <div class="cp-dialog-head"><h3>Connect domain</h3><button class="cp-dialog-x" id="domainDialogClose" type="button" aria-label="Close">×</button></div>
    <form id="domainForm" novalidate>
      <label class="field"><span>Domain</span><input id="domainHostname" placeholder="example.org" required></label>
      <label class="field"><span>Connect to</span><select id="domainTargetType"><option value="website">Website</option><option value="campaign">Campaign microsite</option></select></label>
      <label class="field"><span>Choose item</span><select id="domainTargetId"></select></label>
      <div class="cp-dialog-actions"><button class="btn secondary" type="button" id="domainCancel">Cancel</button><button class="btn" type="submit">Add domain</button></div>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase-config.js?v=20260826-stage3a"></script>
